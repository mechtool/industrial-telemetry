# ========================================================
# Industrial Telemetry — Production (Yandex Cloud VM)
# PostgreSQL + Kratos + Server + Nginx/Angular + MQTT
#
# Использование:
#   docker compose -f docker-compose.yc.yml up -d
# ========================================================

services:
  # ---- PostgreSQL (для Kratos) ----
  kratos-db:
    image: postgres:16-alpine
    container_name: it-kratos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kratos}
      POSTGRES_DB: kratos
    volumes:
      - kratos-db-data:/var/lib/postgresql/data
      - ./keto/init-keto.sql:/docker-entrypoint-initdb.d/init-keto.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - it-network

  # ---- Kratos миграция ----
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: it-kratos-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro
    networks:
      - it-network

  # ---- Ory Kratos ----
  kratos:
    image: oryd/kratos:v1.3.1
    container_name: it-kratos
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"
      - "4434:4434"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4433/health/alive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/kratos?sslmode=disable
      - SMTP_URI=${SMTP_URI:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed "s|__SMTP_URI__|$$SMTP_URI|g" /etc/config/kratos/kratos.yc.yml > /tmp/kratos.yml
        exec kratos serve -c /tmp/kratos.yml --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos:ro
    networks:
      - it-network

  # ---- Ory Keto: Permission Server ----
  keto-migrate:
    image: oryd/keto:v0.14.0
    container_name: it-keto-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/keto?sslmode=disable
    command: migrate up -y -c /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    networks:
      - it-network

  keto:
    image: oryd/keto:v0.14.0
    container_name: it-keto
    restart: unless-stopped
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4466/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/keto?sslmode=disable
    command: serve -c /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    networks:
      - it-network

  # ---- Express API Server ----
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: it-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_CLIENT=false
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_ADMIN_URL=http://kratos:4434
      - KETO_READ_URL=http://keto:4466
      - KETO_WRITE_URL=http://keto:4467
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_CLIENT_ID=industrial-telemetry-server
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_PREFIX=industrial/
      - CORS_ORIGIN=https://${DOMAIN:-industrial-telemetry.ru}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - DADATA_API_KEY=${DADATA_API_KEY:-}
    depends_on:
      kratos:
        condition: service_healthy
    networks:
      - it-network

  # ---- Mosquitto MQTT ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: it-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - it-network

  # ---- Миграция схемы телеметрии ----
  # Одноразовый контейнер: идемпотентно создаёт БД telemetry и применяет
  # scripts/telemetry-schema.sql, после чего завершается.
  telemetry-migrate:
    image: postgres:16-alpine
    container_name: it-telemetry-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${DB_PASSWORD:-kratos}
      - DB_NAME=${DB_NAME:-telemetry}
      - DB_USER=${DB_USER:-kratos}
    volumes:
      - ./scripts/telemetry-schema.sql:/schema/telemetry-schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[Миграция] Проверяю базу $$DB_NAME ..."
        psql -h kratos-db -U $$DB_USER -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          || psql -h kratos-db -U $$DB_USER -d postgres -c \
             "CREATE DATABASE $$DB_NAME OWNER $$DB_USER"
        echo "[Миграция] Применяю схему ..."
        psql -h kratos-db -U $$DB_USER -d $$DB_NAME -f /schema/telemetry-schema.sql
        echo "[Миграция] Готово."
    networks:
      - it-network

  # ---- Сервис-хранитель телеметрии ----
  # Подписывается на MQTT (сообщения шлюза), нормализует и пишет в telemetry.
  # Тот же образ, что у server, но с точкой входа dist/src/keeper.js.
  keeper:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: it-keeper
    restart: unless-stopped
    command: ["node", "dist/src/keeper.js"]
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPIC_PREFIX=industrial/
      - MQTT_SUBSCRIBE_TOPICS=${MQTT_SUBSCRIBE_TOPICS:-sensors/#}
      - MQTT_KEEPER_CLIENT_ID=akcc55-keeper
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - DEVICE_ID=${DEVICE_ID:-akcc55-084B4081}
      - DATABASE_URL=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/${DB_NAME:-telemetry}?sslmode=disable
      - HEALTH_PORT=3100
    depends_on:
      mosquitto:
        condition: service_started
      kratos-db:
        condition: service_healthy
      telemetry-migrate:
        condition: service_completed_successfully
    networks:
      - it-network

  # ---- Nginx + Angular PWA (основной вход) ----
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: it-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL сертификаты Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      server:
        condition: service_started
      kratos:
        condition: service_healthy
    networks:
      - it-network

  # ---- Certbot (Let's Encrypt) ----
  certbot:
    image: certbot/certbot
    container_name: it-certbot
    profiles: ["ssl"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ""
    command: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h;
      done"

volumes:
  kratos-db-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local
  certbot-webroot:
    driver: local

networks:
  it-network:
    driver: bridge
    name: it-network
