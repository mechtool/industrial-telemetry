# ========================================================
# Industrial Telemetry — Production (Yandex Cloud VM)
# PostgreSQL + Kratos + Server + Nginx/Angular + MQTT
#
# Использование:
#   docker compose -f docker-compose.yc.yml up -d
# ========================================================

services:
  # ---- PostgreSQL (для Kratos) ----
  kratos-db:
    image: postgres:16-alpine
    container_name: it-kratos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kratos}
      POSTGRES_DB: kratos
    volumes:
      - kratos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - it-network

  # ---- Kratos миграция ----
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: it-kratos-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro
    networks:
      - it-network

  # ---- Ory Kratos ----
  kratos:
    image: oryd/kratos:v1.3.1
    container_name: it-kratos
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"
      - "4434:4434"
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/kratos?sslmode=disable
    command: serve -c /etc/config/kratos/kratos.yc.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos:ro
    networks:
      - it-network

  # ---- Ory Keto: Permission Server ----
  keto-migrate:
    image: oryd/keto:v0.14.0-alpha.0
    container_name: it-keto-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/keto?sslmode=disable
    command: migrate up -y
    volumes:
      - ./keto:/etc/config/keto:ro
    networks:
      - it-network

  keto:
    image: oryd/keto:v0.14.0-alpha.0
    container_name: it-keto
    restart: unless-stopped
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    environment:
      - DSN=postgres://kratos:${DB_PASSWORD:-kratos}@kratos-db:5432/keto?sslmode=disable
    command: serve -c /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro
    networks:
      - it-network

  # ---- Express API Server ----
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: it-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_CLIENT=false
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KETO_READ_URL=http://keto:4466
      - KETO_WRITE_URL=http://keto:4467
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_CLIENT_ID=industrial-telemetry-server
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_PREFIX=industrial/
      - CORS_ORIGIN=https://${DOMAIN:-industrial-telemetry.ru}
    depends_on:
      kratos:
        condition: service_started
    networks:
      - it-network

  # ---- Mosquitto MQTT ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: it-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - it-network

  # ---- Nginx + Angular PWA (основной вход) ----
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: it-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL сертификаты Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - server
      - kratos
    networks:
      - it-network

  # ---- Certbot (Let's Encrypt) ----
  certbot:
    image: certbot/certbot
    container_name: it-certbot
    profiles: ["ssl"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ""
    command: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h;
      done"

volumes:
  kratos-db-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local
  certbot-webroot:
    driver: local

networks:
  it-network:
    driver: bridge
    name: it-network
