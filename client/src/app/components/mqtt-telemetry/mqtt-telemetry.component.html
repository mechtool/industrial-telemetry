<div class="page-container">
  <h1 class="page-title">MQTT Телеметрия</h1>

  <!-- Статус -->
  <div class="card-grid mb-3">
    <nz-card>
      <div class="status-card-inner">
        <nz-icon
          nzType="wifi"
          class="status-card-icon"
          [style.color]="connected() ? 'var(--color-mqtt-online)' : 'var(--color-mqtt-offline)'"
        />
        <div>
          <div class="status-card-label">MQTT брокер</div>
          <nz-tag [nzColor]="connected() ? 'green' : 'red'">
            {{ connected() ? 'Подключён' : 'Отключён' }}
          </nz-tag>
        </div>
      </div>
    </nz-card>
    <nz-card>
      <div class="status-card-inner">
        <nz-icon nzType="apartment" class="status-card-icon" style="color:#8b5cf6" />
        <div>
          <div class="status-card-label">Активных подписок</div>
          <span class="status-card-count">{{ subscriptions().length }}</span>
        </div>
      </div>
    </nz-card>
  </div>

  <!-- Управление подписками -->
  <nz-card nzTitle="Управление подписками" class="mb-3">
    <div class="subscribe-row">
      <div class="subscribe-input">
        <label class="field-label">Топик</label>
        <input nz-input [(ngModel)]="newTopic" placeholder="sensors/temperature" />
      </div>
      <button
        nz-button
        nzType="primary"
        [nzLoading]="subscribing()"
        [disabled]="!newTopic() || subscribing()"
        (click)="subscribe()"
      >
        <nz-icon nzType="plus" /> Подписаться
      </button>
      <button
        nz-button
        nzDanger
        [disabled]="!newTopic() || subscribing()"
        (click)="unsubscribe()"
      >
        <nz-icon nzType="minus" /> Отписаться
      </button>
    </div>
    <nz-divider />
    <h3 class="section-subtitle">Активные подписки</h3>
    @if (subscriptions().length > 0) {
      <div class="tag-list">
        @for (sub of subscriptions(); track sub) {
          <nz-tag nzColor="blue" class="clickable-tag" (click)="newTopic.set(sub)">{{ sub }}</nz-tag>
        }
      </div>
    } @else {
      <span class="text-muted">Нет активных подписок</span>
    }
  </nz-card>

  <!-- Публикация -->
  <nz-card nzTitle="Публикация сообщения">
    <div class="publish-form">
      <div class="publish-row">
        <div class="publish-input">
          <label class="field-label">Топик</label>
          <input nz-input [(ngModel)]="publishTopic" placeholder="sensors/alarm" />
        </div>
        <div class="publish-input">
          <label class="field-label">Сообщение</label>
          <input nz-input [(ngModel)]="publishMessage" placeholder='{"value": 42}' />
        </div>
        <button
          nz-button
          nzType="primary"
          [nzLoading]="publishing()"
          [disabled]="!publishTopic() || !publishMessage() || publishing()"
          (click)="publish()"
        >
          <nz-icon nzType="send" /> Отправить
        </button>
      </div>
    </div>
  </nz-card>
</div>
