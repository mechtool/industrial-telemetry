<div class="auth-container">
  <div class="auth-card-wrapper">
    <nz-card>
      <div class="auth-header">
        <span nz-icon nzType="shop" class="auth-logo"></span>
        <h1 class="auth-title">Industrial Telemetry</h1>
        <p class="auth-subtitle">
          @if (mode() === 'login') { Войдите в систему } @else { Создайте учётную запись }
        </p>
      </div>

      @if (error()) {
        <nz-alert nzType="error" [nzShowIcon]="true" [nzMessage]="error()!" class="auth-alert"></nz-alert>
      }

      @if (mode() === 'login') {
        <form #loginForm="ngForm" (ngSubmit)="submitLogin()" class="auth-form">
          <input nz-input type="email" id="kratos-email" [(ngModel)]="email" name="email"
            autocomplete="email" required placeholder="Email" />

          <input nz-input type="password" id="kratos-password" [(ngModel)]="password" name="password"
            autocomplete="current-password" required placeholder="Пароль" />

          <button nz-button nzType="primary" nzBlock [nzLoading]="loading()"
            [disabled]="loading() || loginForm.invalid" type="submit">
            <span nz-icon nzType="login"></span>
            Войти
          </button>

          <div class="auth-links">
            <button nz-button nzType="link" type="button" (click)="startRecovery()">Забыли пароль?</button>
            <button nz-button nzType="link" type="button" (click)="startVerification()">Подтвердить email</button>
          </div>
        </form>
      }

      @if (mode() === 'registration') {
        <form #regForm="ngForm" (ngSubmit)="submitRegistration()" class="auth-form">
          <input nz-input type="email" id="kratos-reg-email" [(ngModel)]="email" name="reg-email"
            autocomplete="email" required placeholder="Email" />

          <input nz-input id="kratos-reg-username" [(ngModel)]="username" name="reg-username"
            autocomplete="username" required placeholder="Имя пользователя" />

          <input nz-input type="password" id="kratos-reg-password" [(ngModel)]="password" name="reg-password"
            autocomplete="new-password" required placeholder="Пароль" />

          <input nz-input type="password" id="kratos-reg-confirm" [(ngModel)]="passwordConfirm" name="reg-confirm"
            autocomplete="new-password" required placeholder="Подтвердите пароль" />

          <button nz-button nzType="primary" nzBlock [nzLoading]="loading()"
            [disabled]="loading() || regForm.invalid" type="submit">
            <span nz-icon nzType="user-add"></span>
            Зарегистрироваться
          </button>
        </form>
      }

      <div class="auth-toggle">
        @if (mode() === 'login') {
          <span class="toggle-text">Нет аккаунта?</span>
          <a nz-button nzType="link" (click)="setMode('registration'); $event.preventDefault()">Зарегистрироваться</a>
        } @else {
          <span class="toggle-text">Уже есть аккаунт?</span>
          <a nz-button nzType="link" (click)="setMode('login'); $event.preventDefault()">Войти</a>
        }
      </div>
    </nz-card>
  </div>
</div>
