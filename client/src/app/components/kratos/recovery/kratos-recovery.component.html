<div class="auth-container">
  <div class="auth-card-wrapper">
    <nz-card>
      <div class="auth-header">
        <span nz-icon nzType="shop" class="auth-logo"></span>
        <h1 class="auth-title">Industrial Telemetry</h1>
        <p class="auth-subtitle">Восстановление пароля</p>
      </div>

      @if (error()) {
        <nz-alert nzType="error" [nzShowIcon]="true" [nzMessage]="error()!" class="auth-alert"></nz-alert>
      }

      @if (success()) {
        <nz-alert nzType="success" [nzShowIcon]="true"
          nzMessage="Инструкции по восстановлению пароля отправлены на указанный email. Проверьте почту."
          class="auth-alert">
        </nz-alert>
      } @else {
        <form #recoveryForm="ngForm" (ngSubmit)="submitRecovery()" class="auth-form">
          <input nz-input type="email" id="kratos-recovery-email" [(ngModel)]="email" name="recovery-email"
            autocomplete="email" required placeholder="Введите email, указанный при регистрации" />

          <button nz-button nzType="primary" nzBlock [nzLoading]="loading()"
            [disabled]="loading() || recoveryForm.invalid" type="submit">
            <span nz-icon nzType="mail"></span>
            Восстановить пароль
          </button>
        </form>
      }
    </nz-card>

    <div class="auth-back">
      <a nz-button nzType="link" routerLink="/login">
        <span nz-icon nzType="arrow-left"></span>
        Вернуться ко входу
      </a>
    </div>
  </div>
</div>
