<div class="ol-filters">
  <div class="ol-search">
    <nz-icon nzType="search" class="ol-search-icon" />
    <input class="ol-search-input" placeholder="Поиск по объектам..." />
  </div>
  <nz-select class="ol-select" nzValue="Все типы">
    @for (o of typeOptions; track o) {
      <nz-option [nzValue]="o" [nzLabel]="o" />
    }
  </nz-select>
  <nz-select class="ol-select" nzValue="Все статусы">
    @for (o of statusOptions; track o) {
      <nz-option [nzValue]="o" [nzLabel]="o" />
    }
  </nz-select>
  <button nz-button class="ol-reset">Сбросить фильтры</button>
  <button nz-button nzType="primary" class="ol-add-btn" (click)="openNewObject()">
    <nz-icon nzType="plus" />
    Добавить объект
  </button>
</div>

<div class="ol-table-wrap">
  <table class="ol-table">
    <thead>
      <tr>
        <th>Название</th>
        <th>Тип объекта</th>
        <th>Контроллер</th>
        <th>Статус</th>
        <th>Последнее обновление</th>
        <th class="ol-actions-col">Действия</th>
      </tr>
    </thead>
    <tbody>
      @for (o of objects; track o.name) {
        <tr>
          <td class="ol-name">{{ o.name }}</td>
          <td>{{ o.type }}</td>
          <td>{{ o.controller }}</td>
          <td>
            <span class="ol-status" [style.color]="statusColor(o.status)">
              <span class="ol-status-dot" [style.background]="statusColor(o.status)"></span>
              {{ o.status }}
            </span>
          </td>
          <td class="ol-updated">{{ o.updated }}</td>
          <td class="ol-actions-col">
            <div class="ol-row-actions">
              <button class="ol-icon-btn" title="Редактировать"><nz-icon nzType="edit" /></button>
              <button class="ol-icon-btn ol-icon-btn--danger" title="Удалить"><nz-icon nzType="delete" /></button>
              <button class="ol-icon-btn" title="Ещё"><nz-icon nzType="ellipsis" /></button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<div class="ol-footer">
  <span>Всего: {{ objects.length }} объектов</span>
  <div class="ol-pages">
    <span class="ol-page active">1</span>
  </div>
</div>
