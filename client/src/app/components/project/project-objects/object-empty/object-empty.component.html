<div class="oe-empty">
  <span class="oe-icon"><nz-icon nzType="apartment" /></span>
  <h2 class="oe-title">Объекты ещё не добавлены</h2>
  <p class="oe-desc">
    Создайте первый объект мониторинга, чтобы начать отслеживать параметры холодильного оборудования.
  </p>
  <div class="oe-actions">
    <button nz-button nzType="primary" class="oe-action-primary" (click)="openNewObject()">
      <nz-icon nzType="plus" />
      Создать объект
    </button>
    <button nz-button class="oe-action-secondary">Сбросить фильтры</button>
  </div>
  <p class="oe-tip">Объекты — это физические единицы оборудования в проекте</p>
</div>
