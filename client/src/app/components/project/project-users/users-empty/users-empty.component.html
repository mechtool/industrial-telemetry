<div class="ue-empty">
  <span class="ue-icon"><nz-icon nzType="team" /></span>
  <h2 class="ue-title">Пользователей пока нет</h2>
  <p class="ue-desc">Добавьте первого пользователя, чтобы предоставить доступ к системе мониторинга.</p>
  <div class="ue-actions">
    <button nz-button nzType="primary" (click)="openNewUser()">
      <nz-icon nzType="plus" />
      Создать пользователя
    </button>
    <button nz-button>
      <nz-icon nzType="user-add" />
      Пригласить пользователя
    </button>
  </div>
</div>
