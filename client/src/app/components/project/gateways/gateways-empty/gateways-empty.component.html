<div class="gwe-empty">
  <span class="gwe-icon"><nz-icon nzType="wifi" /></span>
  <h2 class="gwe-title">Шлюзы ещё не добавлены</h2>
  <p class="gwe-desc">
    Создайте первый шлюз, чтобы начать интегрировать внешние системы.
  </p>
  <div class="gwe-actions">
    <button nz-button nzType="primary" class="gwe-action-primary" (click)="openNewGateway()">
      <nz-icon nzType="plus" />
      Добавить шлюз
    </button>
    <button nz-button class="gwe-action-secondary">Сбросить фильтры</button>
  </div>
  <p class="gwe-tip">Шлюзы — это точки интеграции с внешними сервисами и системами</p>
</div>
