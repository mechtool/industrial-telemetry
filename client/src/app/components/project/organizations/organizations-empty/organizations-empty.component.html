<div class="oge-empty">
  <span class="oge-icon"><nz-icon nzType="cluster" /></span>
  <h2 class="oge-title">Организации ещё не добавлены</h2>
  <p class="oge-desc">
    Создайте первую организацию, чтобы назначить сервисные и подрядные компании проекта.
  </p>
  <div class="oge-actions">
    <button nz-button nzType="primary" class="oge-action-primary" (click)="openNewOrganization()">
      <nz-icon nzType="plus" />
      Добавить организацию
    </button>
    <button nz-button class="oge-action-secondary">Сбросить фильтры</button>
  </div>
  <p class="oge-tip">Организации — это сервисные, подрядные и обслуживающие компании проекта</p>
</div>
