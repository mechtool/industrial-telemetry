<div class="ogl-filters">
  <div class="ogl-search">
    <nz-icon nzType="search" class="ogl-search-icon" />
    <input class="ogl-search-input" placeholder="Поиск по организациям..." />
  </div>
  <nz-select class="ogl-select" nzValue="Все типы">
    @for (o of typeOptions; track o) {
      <nz-option [nzValue]="o" [nzLabel]="o" />
    }
  </nz-select>
  <button nz-button class="ogl-reset">Сбросить фильтры</button>
  <button nz-button nzType="primary" class="ogl-add-btn" (click)="openNewOrganization()">
    <nz-icon nzType="plus" />
    Добавить организацию
  </button>
</div>

<div class="ogl-table-wrap">
  <table class="ogl-table">
    <thead>
      <tr>
        <th>Наименование</th>
        <th>ID</th>
        <th>Тип организации</th>
        <th>Адрес</th>
        <th>Телефон</th>
        <th class="ogl-actions-col">Действия</th>
      </tr>
    </thead>
    <tbody>
      @for (o of organizations; track o.id) {
        <tr>
          <td class="ogl-name">{{ o.name }}</td>
          <td class="ogl-id">{{ o.id }}</td>
          <td>{{ o.type }}</td>
          <td class="ogl-address">{{ o.address }}</td>
          <td class="ogl-phone">{{ o.phone }}</td>
          <td class="ogl-actions-col">
            <div class="ogl-row-actions">
              <button class="ogl-icon-btn" title="Редактировать"><nz-icon nzType="edit" /></button>
              <button class="ogl-icon-btn ogl-icon-btn--danger" title="Удалить"><nz-icon nzType="delete" /></button>
              <button class="ogl-icon-btn" title="Ещё"><nz-icon nzType="ellipsis" /></button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<div class="ogl-footer">
  <span>Всего: {{ organizations.length }} организаций</span>
  <div class="ogl-pages">
    <span class="ogl-page active">1</span>
  </div>
</div>
