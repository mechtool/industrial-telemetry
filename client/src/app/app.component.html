@if (kratosService.isAuthenticated()) {
  <div class="layout-wrapper">
    <a href="#main-content" class="skip-link">Перейти к содержимому</a>

    <aside class="layout-sidebar">
      <div class="sidebar-header">
        <i class="pi pi-industry text-3xl" style="color: var(--p-primary-color)" aria-hidden="true"></i>
        <span class="text-xl font-bold ml-2">Telemetry</span>
      </div>

      <nav class="sidebar-nav">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="nav-item"
            [attr.aria-label]="item.label"
            [attr.aria-current]="router.url === item.route ? 'page' : null"
          >
            <i [class]="item.icon + ' text-xl'" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="sidebar-user">
        @if (kratosService.currentUser(); as user) {
          <div class="sidebar-user-info">
            <p-avatar
              [label]="user.username.charAt(0).toUpperCase()"
              styleClass="mr-2"
              shape="circle"
              size="normal"
            />
            <div class="sidebar-user-details">
              <span class="sidebar-user-name">{{ user.username }}</span>
              <span class="sidebar-user-role">{{ user.role }}</span>
            </div>
          </div>
        }
        <p-button
          icon="pi pi-sign-out"
          severity="secondary"
          variant="text"
          rounded
          (onClick)="logout()"
          pTooltip="Выйти"
          tooltipPosition="top"
          aria-label="Выйти"
        />
      </div>

      <div class="sidebar-footer">
        <span class="text-xs text-500">Industrial Telemetry v1.0</span>
      </div>
    </aside>

    <main class="layout-main" id="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
