# ========================================================
# Ory Kratos — Docker-конфигурация (ШАБЛОН для локальной разработки)
# Industrial Telemetry
#
# Скопировать:   cp kratos/kratos.docker.example.yml kratos/kratos.docker.yml
# SMTP-доступ (courier.smtp.connection_uri) подставляется из переменной
# окружения SMTP_URI (файл .env) автоматически при старте контейнера —
# пароль приложения НЕ хранится в конфиге. Значение задаётся так:
#   SMTP_URI=smtps://user:APP_PASSWORD@smtp.yandex.ru:465/?skip_ssl_verify=false
# Для локальной отладки можно указать smtp://mailslurper:1025 (письма
# попадут в веб-интерфейс http://localhost:4436).
# Реальный файл kratos/kratos.docker.yml — gitignored.
#
# ВАЖНО: recovery-ссылка из письма после клика редиректится Kratos на
# selfservice.flows.settings.ui_url — он должен указывать на /change-password.
#
# ВАЖНО: secrets.cookie / secrets.cipher (по 32 hex) и значение web_hook
# (`change-me-webhook-secret`) заменить на случайные значения перед запуском
# без флага --dev:
#   node -e "console.log(require('crypto').randomBytes(16).toString('hex'))"
# ========================================================

version: v1.3.1

dsn: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:3000/.ory
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      debug: true
  admin:
    base_url: http://0.0.0.0:4434

selfservice:
  default_browser_return_url: http://localhost:3000/projects
  allowed_return_urls:
    - http://localhost:3000
    - http://localhost:3000/projects
    - http://localhost:3000/dashboard
    - http://localhost:3000/login
    - http://localhost:3000/registration
    - http://localhost:3000/recovery
    - http://localhost:3000/change-password
    - http://localhost:3000/main-entrance
    - http://localhost:3000/link-sent
    - http://localhost:3000/settings
    - http://localhost:3000/error

  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:3000/error

    login:
      ui_url: http://localhost:3000/login
      lifespan: 10m

    registration:
      ui_url: http://localhost:3000/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
            - hook: web_hook
              config:
                url: http://host.docker.internal:3000/api/webhooks/registration
                method: POST
                body: file:///etc/config/kratos/webhook-registration.jsonnet
                auth:
                  type: api_key
                  config:
                    name: Authorization
                    value: change-me-webhook-secret
                    in: header
                response:
                  ignore: true

    settings:
      ui_url: http://localhost:3000/change-password
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://localhost:3000/recovery

    logout:
      after:
        default_browser_return_url: http://localhost:3000/login

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - change-me-cookie-secret-00000000
  cipher:
    - change-me-cipher-secret-00000000

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: __SMTP_URI__
    from_address: noreply@industrial-telemetry.ru
    from_name: Industrial Telemetry

feature_flags:
  use_continue_with_transitions: true
