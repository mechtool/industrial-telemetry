# ========================================================
# Ory Kratos — Docker-конфигурация (ШАБЛОН для локальной разработки)
# Industrial Telemetry
#
# Скопировать:   cp kratos/kratos.docker.example.yml kratos/kratos.docker.yml
# Затем в kratos/kratos.docker.yml подставить реальный пароль приложения
# Яндекса в courier.smtp.connection_uri (место YOUR_YANDEX_APP_PASSWORD).
# Реальный файл kratos/kratos.docker.yml — gitignored.
# ========================================================

version: v1.3.1

dsn: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      debug: true
  admin:
    base_url: http://0.0.0.0:4434

selfservice:
  default_browser_return_url: http://localhost:4200/projects
  allowed_return_urls:
    - http://localhost:4200
    - http://localhost:4200/projects
    - http://localhost:4200/dashboard
    - http://localhost:4200/login
    - http://localhost:4200/registration
    - http://localhost:4200/recovery

  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:4200/error

    login:
      ui_url: http://localhost:4200/login
      lifespan: 10m

    registration:
      ui_url: http://localhost:4200/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://localhost:4200/recovery
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://localhost:4200/recovery

    logout:
      after:
        default_browser_return_url: http://localhost:4200/login

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - change-me-cookie-secret-00000000
  cipher:
    - change-me-cipher-secret-00000000

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://mit-2%40yandex.ru:YOUR_YANDEX_APP_PASSWORD@smtp.yandex.ru:465/?skip_ssl_verify=false
    from_address: mit-2@yandex.ru

feature_flags:
  use_continue_with_transitions: false
