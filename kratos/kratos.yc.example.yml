# ========================================================
# Ory Kratos — kratos.yc.example.yml (шаблон для Yandex Cloud)
#
# Скопировать:   cp kratos/kratos.yc.example.yml kratos/kratos.yc.yml
# Затем заменить плейсхолдеры на реальные значения:
#   - secrets.cookie / secrets.cipher — ровно 32 hex-символа
#     (node -e "console.log(require('crypto').randomBytes(16).toString('hex'))")
#   - courier.smtp.connection_uri — SMTP-доступ приложения (отдельный
#     почтовый ящик noreply@<домен> либо транзакционный SMTP-сервис).
#
# ВАЖНО: recovery-ссылка из письма после клика редиректится Kratos на
# selfservice.flows.settings.ui_url. Он обязан указывать на страницу
# смены пароля (/change-password), иначе пользователь попадёт не туда.
# ========================================================

version: v1.3.1

dsn: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: https://industrial-telemetry.ru/.ory
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      debug: true
  admin:
    base_url: http://localhost:4434

selfservice:
  default_browser_return_url: https://industrial-telemetry.ru/projects
  allowed_return_urls:
    - https://industrial-telemetry.ru
    - https://industrial-telemetry.ru/projects
    - https://industrial-telemetry.ru/dashboard
    - https://industrial-telemetry.ru/login
    - https://industrial-telemetry.ru/recovery
    - https://industrial-telemetry.ru/change-password

  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: https://industrial-telemetry.ru/error

    login:
      ui_url: https://industrial-telemetry.ru/login
      lifespan: 10m

    registration:
      ui_url: https://industrial-telemetry.ru/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
            - hook: web_hook
              config:
                url: http://server:3000/api/webhooks/registration
                method: POST
                body: file:///etc/config/kratos/webhook-registration.jsonnet
                auth:
                  type: api_key
                  config:
                    name: Authorization
                    value: change-me-webhook-secret
                    in: header
                response:
                  ignore: true

    settings:
      ui_url: https://industrial-telemetry.ru/change-password
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: https://industrial-telemetry.ru/recovery

    logout:
      after:
        default_browser_return_url: https://industrial-telemetry.ru/login

# Сессионные куки: SameSite + Secure (авто при https base_url)
session:
  lifespan: 168h
  cookie:
    same_site: Lax

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - change-me-cookie-secret-00000000
  cipher:
    - change-me-cipher-secret-00000000

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # Отдельный почтовый ящик приложения (не личный). Примеры:
    #   - Яндекс 360 для домена industrial-telemetry.ru: smtps://noreply%40industrial-telemetry.ru:<пароль-приложения>@smtp.yandex.ru:465/?skip_ssl_verify=false
    #   - Транзакционный сервис (Mailgun/SMTP2GO/SendGrid/Resend): smtps://<user>:<key>@<smtp-хост>:465/?skip_ssl_verify=false
    connection_uri: smtps://noreply%40industrial-telemetry.ru:YOUR_APP_PASSWORD@smtp.yandex.ru:465/?skip_ssl_verify=false
    from_address: noreply@industrial-telemetry.ru
    from_name: Industrial Telemetry

feature_flags:
  use_continue_with_transitions: false
