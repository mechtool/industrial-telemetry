# ========================================================
# Ory Kratos — kratos.yc.yml (Yandex Cloud)
# Конфигурация для Industrial Telemetry
# ========================================================

version: v1.3.1

dsn: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://158.160.204.124/.ory
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      debug: true
  admin:
    base_url: http://localhost:4434

selfservice:
  default_browser_return_url: http://158.160.204.124/dashboard
  allowed_return_urls:
    - http://158.160.204.124
    - http://158.160.204.124/dashboard
    - http://158.160.204.124/login
    - http://158.160.204.124/settings

  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://158.160.204.124/error

    login:
      ui_url: http://158.160.204.124/login
      lifespan: 10m

    registration:
      ui_url: http://158.160.204.124/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://158.160.204.124/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://158.160.204.124/recovery

    verification:
      enabled: true
      ui_url: http://158.160.204.124/verification

    logout:
      after:
        default_browser_return_url: http://158.160.204.124/login

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - 70e2554b4468d42ef55117defc745f41a16f5bee90376a514185d1442dd19461
  cipher:
    - 49777f3f7e5b382d412145d3a843467f6dd8d61a06227af187ff3e3aa8dddb85

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://mit-2%40yandex.ru:REDACTED@smtp.yandex.ru:465/?skip_ssl_verify=false

feature_flags:
  use_continue_with_transitions: true