version: v1.3.1

dsn: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://industrial-telemetry.ru/.ory
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      debug: true
  admin:
    base_url: http://localhost:4434

selfservice:
  default_browser_return_url: http://industrial-telemetry.ru/dashboard
  allowed_return_urls:
    - http://industrial-telemetry.ru
    - http://industrial-telemetry.ru/dashboard
    - http://industrial-telemetry.ru/login
    - http://industrial-telemetry.ru/settings

  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: http://industrial-telemetry.ru/error

    login:
      ui_url: http://industrial-telemetry.ru/login
      lifespan: 10m

    registration:
      ui_url: http://industrial-telemetry.ru/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://industrial-telemetry.ru/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://industrial-telemetry.ru/recovery

    verification:
      enabled: true
      ui_url: http://industrial-telemetry.ru/verification

    logout:
      after:
        default_browser_return_url: http://industrial-telemetry.ru/login

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - REDACTED
  cipher:
    - REDACTED

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://mit-2%40yandex.ru:REDACTED@smtp.yandex.ru:465/?skip_ssl_verify=false

feature_flags:
  use_continue_with_transitions: true