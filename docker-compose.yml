# ========================================================
# Industrial Telemetry — локальная разработка
# PostgreSQL + Ory Kratos + Backend Server
# ========================================================

services:
  # ---- PostgreSQL для Kratos ----
  kratos-db:
    image: postgres:16-alpine
    container_name: telemetry-kratos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kratos}
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    volumes:
      - kratos-db-data:/var/lib/postgresql/data
      - ./keto/init-keto.sql:/docker-entrypoint-initdb.d/init-keto.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Миграция схемы Kratos ----
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: telemetry-kratos-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro

  # ---- Ory Kratos ----
  kratos:
    image: oryd/kratos:v1.3.1
    container_name: telemetry-kratos
    restart: unless-stopped
    depends_on:
      kratos-db:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"   # Public API
      - "4434:4434"   # Admin API
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
      - KRATOS_PUBLIC_BASE_URL=${KRATOS_PUBLIC_BASE_URL:-http://localhost:3000/.ory}
      - UI_BASE_URL=${UI_BASE_URL:-http://localhost:3000}
      - SMTP_URI=${SMTP_URI:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed "s|__SMTP_URI__|$$SMTP_URI|g" /etc/config/kratos/kratos.docker.yml > /tmp/kratos.yml
        exec kratos serve -c /tmp/kratos.yml --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos:ro

  # ---- Ory Keto: Permission Server (RBAC) ----
  keto-migrate:
    image: oryd/keto:v0.14.0
    container_name: telemetry-keto-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/keto?sslmode=disable
    command: migrate up -y -c /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro

  keto:
    image: oryd/keto:v0.14.0
    container_name: telemetry-keto
    restart: unless-stopped
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    ports:
      - "4466:4466"   # Read API
      - "4467:4467"   # Write API
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/keto?sslmode=disable
    command: serve -c /etc/config/keto/keto.yml
    volumes:
      - ./keto:/etc/config/keto:ro

  # ---- MailSlurper: локальный SMTP-перехватчик (dev-почта) ----
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    container_name: telemetry-mailslurper
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (plain)
      - "4436:4436"   # Web UI (HTTP)
      - "4437:4437"   # Web UI (HTTPS)

  # ---- Mosquitto MQTT (dev) ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: telemetry-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t it/healthcheck -m ok -q 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Миграция схемы телеметрии ----
  # Одноразовый контейнер: идемпотентно создаёт БД telemetry и применяет
  # scripts/telemetry-schema.sql, после чего завершается.
  # Профиль: docker compose --profile telemetry up -d telemetry-migrate
  telemetry-migrate:
    image: postgres:16-alpine
    container_name: it-telemetry-migrate
    restart: "no"
    profiles: ["telemetry"]
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${DB_PASSWORD:-kratos}
      - DB_NAME=${DB_NAME:-telemetry}
      - DB_USER=${DB_USER:-kratos}
    volumes:
      - ./scripts/telemetry-schema.sql:/schema/telemetry-schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[Миграция] Проверяю базу $$DB_NAME ..."
        psql -h kratos-db -U $$DB_USER -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          || psql -h kratos-db -U $$DB_USER -d postgres -c \
             "CREATE DATABASE $$DB_NAME OWNER $$DB_USER"
        echo "[Миграция] Применяю схему ..."
        psql -h kratos-db -U $$DB_USER -d $$DB_NAME -f /schema/telemetry-schema.sql
        echo "[Миграция] Готово."

  # ---- Сервис-хранитель телеметрии ----
  # Подписывается на MQTT (сообщения шлюза), нормализует и пишет в таблицу
  # telemetry (Postgres). Схему применяет telemetry-migrate выше.
  # Профиль: docker compose --profile telemetry up -d telemetry-migrate keeper
  keeper:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: it-keeper
    restart: unless-stopped
    profiles: ["telemetry"]
    command: ["node", "dist/src/keeper.js"]
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-industrial/}
      - MQTT_SUBSCRIBE_TOPICS=${MQTT_SUBSCRIBE_TOPICS:-sensors/#}
      - MQTT_KEEPER_CLIENT_ID=akcc55-keeper
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - DEVICE_ID=${DEVICE_ID:-akcc55-084B4081}
      - DATABASE_URL=postgres://${DB_USER:-kratos}:${DB_PASSWORD:-kratos}@${DB_HOST:-kratos-db}:5432/${DB_NAME:-telemetry}?sslmode=disable
      - HEALTH_PORT=3100
    depends_on:
      mosquitto:
        condition: service_started
      kratos-db:
        condition: service_healthy
      telemetry-migrate:
        condition: service_completed_successfully

volumes:
  kratos-db-data:
    driver: local
  mosquitto-data:
    driver: local
  mosquitto-log:
    driver: local
