# ========================================================
# Industrial Telemetry — локальная разработка
# PostgreSQL + Ory Kratos + Backend Server
# ========================================================

services:
  # ---- PostgreSQL для Kratos ----
  kratos-db:
    image: postgres:16-alpine
    container_name: telemetry-kratos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    volumes:
      - kratos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Миграция схемы Kratos ----
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: telemetry-kratos-migrate
    restart: "no"
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro

  # ---- Ory Kratos ----
  kratos:
    image: oryd/kratos:v1.3.1
    container_name: telemetry-kratos
    restart: unless-stopped
    depends_on:
      kratos-db:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"   # Public API
      - "4434:4434"   # Admin API
    environment:
      - DSN=postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
      - KRATOS_PUBLIC_BASE_URL=${KRATOS_PUBLIC_BASE_URL:-http://localhost:4433/.ory}
      - UI_BASE_URL=${UI_BASE_URL:-http://localhost:4200}
      - SMTP_URI=${SMTP_URI:-smtps://mit-2%40yandex.ru:REDACTED@smtp.yandex.ru:465/?skip_ssl_verify=false}
    command: serve -c /etc/config/kratos/kratos.docker.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos:ro

volumes:
  kratos-db-data:
    driver: local
