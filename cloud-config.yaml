#cloud-config
# ========================================================
# Industrial Telemetry — Yandex Cloud VM cloud-init
#
# Назначение: автоматическая настройка ВМ при создании
# Пользователь: mit-2
# Целевая ОС:   Ubuntu 24.04 LTS
# ========================================================

users:
  - name: mit-2
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - git

runcmd:
  # Docker — включить и добавить mit-2 в группу
  - systemctl enable --now docker
  - usermod -aG docker mit-2

  # Swap 2 GB (рекомендовано для ВМ с 4 GB RAM)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Node.js 22 (nodesource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs

  # Лог завершения
  - echo "cloud-init done at $(date)" >> /var/log/cloud-init-done.log

# ========================================================
# После создания ВМ:
#   1. ssh mit-2@<IP>
#   2. Склонировать проект и развернуть по DEPLOYMENT_GUIDE.md
# ========================================================
