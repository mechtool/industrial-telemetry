# ========================================================
# stats-hunter — edge server blocks (served by it-client nginx, SNI).
# Подключается отдельным conf-файлом, не трогая nginx.yc.conf.
# ========================================================

# ---- stats-hunter.ru / www.stats-hunter.ru :80 -> канонический apex ----
server {
    listen 80;
    server_name stats-hunter.ru www.stats-hunter.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stats-hunter.ru$request_uri;
    }
}

# ---- auth.stats-hunter.ru :80 ----
server {
    listen 80;
    server_name auth.stats-hunter.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://auth.stats-hunter.ru$request_uri;
    }
}

# ---- stats-hunter.ru :443 (фронт + /api) ----
server {
    listen 443 ssl http2;
    server_name stats-hunter.ru;

    ssl_certificate     /etc/letsencrypt/live/stats-hunter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats-hunter.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- www.stats-hunter.ru :443 -> apex ----
server {
    listen 443 ssl http2;
    server_name www.stats-hunter.ru;

    ssl_certificate     /etc/letsencrypt/live/stats-hunter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats-hunter.ru/privkey.pem;

    location / {
        return 301 https://stats-hunter.ru$request_uri;
    }
}

# ---- auth.stats-hunter.ru :443 (Keycloak) ----
server {
    listen 443 ssl http2;
    server_name auth.stats-hunter.ru;

    ssl_certificate     /etc/letsencrypt/live/auth.stats-hunter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.stats-hunter.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
