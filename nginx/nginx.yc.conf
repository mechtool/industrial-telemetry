# ========================================================
# Industrial Telemetry — nginx.yc.conf (Yandex Cloud)
# Reverse proxy: HTTPS + HTTP/2 + security headers + rate limiting
#
# Роутинг:
#   /api/*                     → Express server :3000
#   /.ory/*                    → Ory Kratos :4433
#   /.well-known/acme-challenge/* → Certbot
#   /*                         → Angular PWA (статика)
# ========================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ory:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# ========================================================
# HTTP → HTTPS redirect
# ========================================================
server {
    listen 80;
    server_name industrial-telemetry.ru;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================================
# HTTPS server
# ========================================================
server {
    listen 443 ssl http2;
    server_name industrial-telemetry.ru;

    # ---- SSL / TLS ----
    ssl_certificate     /etc/letsencrypt/live/industrial-telemetry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industrial-telemetry.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers ----
    add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "DENY" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Максимальный размер тела запроса
    client_max_body_size 10m;

    # ---- ACME challenge (для автообновления сертификатов) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- API → Express ----
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Kratos browser flows → Kratos ----
    location /.ory/ {
        limit_req zone=ory burst=5 nodelay;

        proxy_pass http://kratos:4433/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- Статика Angular ----
    root /usr/share/nginx/html;
    index index.html;

    # Кеширование статики (JS, CSS, шрифты, картинки)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — всё остальное на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
