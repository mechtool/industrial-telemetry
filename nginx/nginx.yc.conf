# ========================================================
# Industrial Telemetry — nginx.yc.conf
# Reverse proxy для Yandex Cloud VM
#
# Роутинг:
#   /api/*     → Express server :3000
#   /.ory/*    → Ory Kratos :4433
#   /*         → Angular PWA (статика)
# ========================================================

server {
    listen 80;
    server_name industrial-telemetry.ru;

    # Максимальный размер тела запроса
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # --------------- API → Express ---------------
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------- Kratos browser flows → Kratos ---------------
    location /.ory/ {
        proxy_pass http://kratos:4433/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Проброс кук и заголовков для сессий Kratos
        proxy_pass_request_headers on;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------- Статика Angular ---------------
    root /usr/share/nginx/html;
    index index.html;

    # Кеширование статики (JS, CSS, шрифты, картинки)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — всё остальное на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
