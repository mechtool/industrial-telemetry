# Mosquitto MQTT брокер — конфигурация для Industrial Telemetry
# Подробнее: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Для Yandex Cloud в продакшене:
#   - Используйте Yandex IoT Core (управляемый MQTT с TLS и аутентификацией)
#   - Или настройте аутентификацию: allow_anonymous false + password_file

# Базовые настройки
listener 1883
protocol mqtt

# Аутентификация
# В dev-стеке (docker-compose.yml) анонимный доступ для простоты.
# В production заменить на: allow_anonymous false + password_file (или Yandex IoT Core).
allow_anonymous true

# WebSocket для будущих browser-клиентов (если понадобится)
listener 9001
protocol websockets
allow_anonymous true

# Надёжность (QoS/персистентность)
autosave_interval 300
max_queued_messages 1000
max_inflight_messages 20

# Персистентность
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true

# ACL (опционально — закомментировано для разработки)
# acl_file /mosquitto/config/acl.conf