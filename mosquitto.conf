# Mosquitto MQTT брокер — конфигурация для Industrial Telemetry
# Подробнее: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Для Yandex Cloud в продакшене:
#   - Используйте Yandex IoT Core (управляемый MQTT с TLS и аутентификацией)
#   - Или настройте аутентификацию: allow_anonymous false + password_file

# Базовые настройки
listener 1883
protocol mqtt

# Аутентификация
allow_anonymous false
password_file /mosquitto/config/passwd

# Как создать пароль:
#   docker compose -f docker-compose.yc.yml exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd <username> <password>
#   docker compose -f docker-compose.yc.yml restart mosquitto

# WebSocket для будущих browser-клиентов (если понадобится)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# Персистентность
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true

# ACL (опционально — закомментировано для разработки)
# acl_file /mosquitto/config/acl.conf